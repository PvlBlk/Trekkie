// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = "2.0.21"
    ext.ksp_version = "2.0.21-1.0.28"
    ext.hilt_version = "2.52"

    // AndroidX / libraries
    ext.ktx_version = "1.13.1"
    ext.appcompat_version = "1.7.0"
    ext.material_version = "1.12.0"
    ext.constraintlayout_version = "2.2.0"
    ext.nav_version = "2.8.5"
    ext.srl_version = "1.1.0"
    ext.fragment_version = "1.8.5"
    ext.lifecycle_version = "2.8.7"
    ext.viewpager2_version = "1.1.0"
    ext.cardview_version = "1.0.0"
    ext.coroutines_version = "1.9.0"
    ext.room_version = "2.6.1"
    ext.glide_version = "4.16.0"
    ext.shimmer_version = "0.5.0"

    // Networking
    ext.retrofit_version = "2.11.0"
    ext.okhttp_version = "4.12.0"

    // Testing
    ext.junit_version = "4.13.2"
    ext.junit_ext_version = "1.2.1"

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.9.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:$ksp_version"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
